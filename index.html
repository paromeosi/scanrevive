<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScanRevive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='9' width='26' height='14' rx='3' fill='%230a66d8'/><rect x='6' y='15' width='20' height='2' fill='white'/></svg>">
<style>
  :root {
    --bg: #f5f5f3; --panel: #ffffff; --text: #1c1c1e; --muted: #66666b; --line: #e0e0dc;
    --accent: #0a66d8; --on-accent: #ffffff; --danger: #c62828; --ok: #2e7d32; --sel: rgba(10, 102, 216, .16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1e1e21; --text: #f1f1f3; --muted: #a0a0a8; --line: #323236;
      --accent: #4d9bff; --on-accent: #06101e; --danger: #ff6b6b; --ok: #6bd17a; --sel: rgba(77, 155, 255, .2);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; }
  header select { width: auto; }
  #conn { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: auto; }
  #conn::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
  #conn.on::before { background: var(--ok); }
  main { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: calc(100vh - 52px); }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  #work { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
  button, select, input { font: inherit; color: inherit; }
  button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select, input[type=number], input[type=text] { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .actions { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 0; display: grid; gap: 10px; min-width: 0; }
  legend { padding: 0 6px 0 0; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: grid; gap: 4px; }
  .row label { font-size: 13px; }
  .row.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
  .slider { display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center; }
  .hw { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 4px 8px; border-radius: 6px; transition: background .3s; }
  .hw.flash { background: var(--sel); }
  .muted { color: var(--muted); font-size: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .end { margin-left: auto; }
  h2 { font-size: 15px; margin: 0; }
  #stage { position: relative; aspect-ratio: var(--ar, .72); width: min(100%, calc(72vh * var(--ar, .72))); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: none; cursor: crosshair; user-select: none; }
  #stage img { width: 100%; height: 100%; display: block; object-fit: fill; pointer-events: none; -webkit-user-drag: none; }
  #stage img:not([src]) { visibility: hidden; }
  #hint { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; color: var(--muted); text-align: center; pointer-events: none; }
  #sel { position: absolute; border: 2px solid var(--accent); background: var(--sel); box-shadow: 0 0 0 9999px rgba(0, 0, 0, .28); pointer-events: none; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  #gallery:empty::after { content: "No scans yet."; color: var(--muted); }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; }
  figure img, figure .file { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: var(--bg); border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-weight: 600; }
  figcaption { font-size: 12px; word-break: break-all; display: flex; gap: 6px; align-items: start; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>ScanRevive</h1>
  <select id="devices" aria-label="Scanner" hidden></select>
  <span id="conn" role="status">Connecting…</span>
</header>
<main>
  <aside>
    <div class="actions">
      <button id="preview" disabled>Preview</button>
      <button id="scan" class="primary" disabled>Scan</button>
      <button id="cancel" disabled>Cancel</button>
    </div>
    <div>
      <progress id="progress" max="1" value="0" hidden></progress>
      <div id="jobtext" class="muted" aria-live="polite"></div>
    </div>
    <fieldset>
      <legend>Output</legend>
      <div class="row">
        <label for="format">File format</label>
        <select id="format">
          <option value="png">PNG (lossless)</option>
          <option value="jpeg">JPEG (small files, photos)</option>
          <option value="tiff">TIFF (archival)</option>
          <option value="pdf">PDF (documents)</option>
        </select>
      </div>
      <div class="row" id="qrow">
        <label for="quality">Quality: <span id="qval">85</span></label>
        <input type="range" id="quality" min="30" max="100" value="85">
      </div>
    </fieldset>
    <div id="options"></div>
    <label class="row check"><input type="checkbox" id="adv"> <span>Show advanced options</span></label>
    <fieldset id="hwbox" hidden><legend>Buttons on the scanner</legend><div id="hw"></div></fieldset>
  </aside>
  <section id="work">
    <div class="bar">
      <h2>Scan area</h2><span id="area" class="muted"></span>
      <button id="full" class="end" hidden>Select whole glass</button>
    </div>
    <div id="stage">
      <img id="pv" alt="Preview of the scanner glass">
      <div id="hint"><span>Press <b>Preview</b>, then drag to choose the area to scan.</span></div>
      <div id="sel" hidden></div>
    </div>
    <div class="bar">
      <h2>Scans</h2><span id="outdir" class="muted"></span>
      <span class="bar end">
        <button id="pdf" disabled title="Pages follow the order in which you tick them">Combine selected into PDF</button>
        <button id="folder">Open folder</button>
      </span>
    </div>
    <div id="gallery"></div>
  </section>
</main>
<div id="toast" role="alert"></div>
<script>
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const round = v => typeof v === "number" ? Math.round(v * 100) / 100 : v;

async function api(path, body) {
  const init = body === undefined ? undefined : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "", err ? 7000 : 3000);
}
const fail = e => toast(e.message, true);

// ---------------------------------------------------------------- scanner options (generated from what the driver reports)

let opts = [];
const opt = name => opts.find(o => o.name === name && o.active);

async function loadOptions() {
  try { opts = (await api("/api/options")).options; } catch (e) { fail(e); }
  render();
}
async function setOpts(values) {
  try { opts = (await api("/api/options", { values })).options; } catch (e) { fail(e); }
  render();
}

function render() {
  const adv = $("#adv").checked, groups = new Map();
  for (const o of opts) {
    if (!o.active || o.hardware || (o.advanced && !adv)) continue;
    if (!groups.has(o.group)) groups.set(o.group, []);
    groups.get(o.group).push(o);
  }
  $("#options").replaceChildren(...[...groups].map(([g, list]) =>
    el("fieldset", {}, el("legend", { textContent: g || "Options" }), ...list.map(widget))));
  const hw = opts.filter(o => o.hardware && o.type === "bool");
  $("#hwbox").hidden = !hw.length;
  $("#hw").replaceChildren(...hw.map(o =>
    el("div", { className: "hw", id: "hw-" + o.name }, el("b", { textContent: o.title }), el("span", { className: "muted", textContent: o.action }))));
  drawArea();
}

function widget(o) {
  const id = "opt-" + o.name, set = v => setOpts({ [o.name]: v });
  const label = el("label", { htmlFor: id, textContent: o.title + (o.unit ? ` (${o.unit})` : "") });
  const row = el("div", { className: "row", title: o.desc });
  let input;
  if (o.type === "button") {
    return el("button", { type: "button", textContent: o.title, title: o.desc, disabled: !o.settable, onclick: () => set(null) });
  } else if (o.count > 1) {
    // Value arrays (gamma tables): edited through one gamma exponent.
    const [lo, hi] = o.range || [0, 255];
    label.textContent = o.title + " (gamma)";
    input = el("input", { type: "number", id, min: 0.1, max: 5, step: 0.1, value: 1 });
    input.onchange = () => set(Array.from({ length: o.count }, (_, i) => Math.round(lo + (hi - lo) * Math.pow(i / (o.count - 1), 1 / input.value))));
  } else if (o.type === "bool") {
    input = el("input", { type: "checkbox", id, checked: !!o.value, disabled: !o.settable });
    input.onchange = () => set(input.checked);
    row.className = "row check";
    row.append(input, label);
    return row;
  } else if (o.list) {
    input = el("select", { id }, ...o.list.map(v => el("option", { value: v, textContent: round(v), selected: v == o.value })));
    input.onchange = () => set(o.type === "string" ? input.value : +input.value);
  } else if (o.type === "string") {
    input = el("input", { type: "text", id, value: o.value ?? "" });
    input.onchange = () => set(input.value);
  } else {
    const [min, max, q] = o.range || [];
    const step = q || (o.type === "fixed" ? 0.1 : 1);
    input = el("input", { type: "number", id, value: round(o.value), step });
    if (o.range) Object.assign(input, { min, max });
    input.onchange = () => set(+input.value);
    if (o.range && o.unit !== "mm") {
      const slider = el("input", { type: "range", min, max, step, value: o.value, ariaLabel: o.title, disabled: !o.settable });
      slider.oninput = () => input.value = slider.value;
      slider.onchange = () => set(+slider.value);
      input.disabled = !o.settable;
      row.append(label, el("div", { className: "slider" }, slider, input));
      return row;
    }
  }
  input.disabled = !o.settable;
  row.append(label, input);
  return row;
}

// ---------------------------------------------------------------- scan area: drag on the preview

const stage = $("#stage");
function bounds() {
  const tx = opt("tl-x"), ty = opt("tl-y"), bx = opt("br-x"), by = opt("br-y");
  if (!(tx && ty && bx && by && tx.range && ty.range && bx.range && by.range)) return null;
  return { x0: tx.range[0], x1: bx.range[1], y0: ty.range[0], y1: by.range[1], v: [tx.value, ty.value, bx.value, by.value], unit: tx.unit };
}
function paint([a, b, c, d]) {
  Object.assign($("#sel").style, { left: a * 100 + "%", top: b * 100 + "%", width: (c - a) * 100 + "%", height: (d - b) * 100 + "%" });
}
function drawArea() {
  const b = bounds();
  $("#full").hidden = $("#sel").hidden = !b;
  if (!b) return void ($("#area").textContent = "");
  const W = b.x1 - b.x0, H = b.y1 - b.y0, [l, t, r, d] = b.v;
  stage.style.setProperty("--ar", W / H);
  paint([(l - b.x0) / W, (t - b.y0) / H, (r - b.x0) / W, (d - b.y0) / H]);
  const res = (opt("resolution") || {}).value, mm = b.unit === "mm";
  $("#area").textContent = `${round(r - l)} × ${round(d - t)} ${b.unit}` +
    (res && mm ? ` · ${Math.round((r - l) / 25.4 * res)} × ${Math.round((d - t) / 25.4 * res)} px at ${res} dpi` : "");
}

let drag = null;
const point = e => {
  const r = stage.getBoundingClientRect(), c = v => Math.min(1, Math.max(0, v));
  return [c((e.clientX - r.left) / r.width), c((e.clientY - r.top) / r.height)];
};
const rectTo = e => {
  const [x0, y0] = drag, [x1, y1] = point(e);
  return [Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)];
};
stage.onpointerdown = e => { if (bounds()) { e.preventDefault(); drag = point(e); stage.setPointerCapture(e.pointerId); } };
stage.onpointermove = e => { if (drag) paint(rectTo(e)); };
stage.onpointercancel = () => { drag = null; drawArea(); };
stage.onpointerup = e => {
  if (!drag) return;
  const r = rectTo(e);
  drag = null;
  if (r[2] - r[0] < 0.01 || r[3] - r[1] < 0.01) return drawArea();
  const b = bounds(), at = (f, a, z) => Math.round((a + f * (z - a)) * 10) / 10;
  setOpts({ "tl-x": at(r[0], b.x0, b.x1), "tl-y": at(r[1], b.y0, b.y1), "br-x": at(r[2], b.x0, b.x1), "br-y": at(r[3], b.y0, b.y1) });
};
$("#full").onclick = () => { const b = bounds(); setOpts({ "tl-x": b.x0, "tl-y": b.y0, "br-x": b.x1, "br-y": b.y1 }); };

// ---------------------------------------------------------------- saved scans

let picked = [];
async function loadScans() {
  const { scans } = await api("/api/scans").catch(() => ({ scans: [] }));
  picked = picked.filter(n => scans.some(s => s.name === n));
  $("#gallery").replaceChildren(...scans.map(f => {
    const url = encodeURIComponent(f.name), isPdf = /\.pdf$/i.test(f.name);
    const box = el("input", { type: "checkbox", checked: picked.includes(f.name), disabled: isPdf, ariaLabel: "Select " + f.name });
    box.onchange = () => { picked = box.checked ? [...picked, f.name] : picked.filter(n => n !== f.name); updatePdfButton(); };
    const img = el("img", { src: "/thumbs/" + url, alt: f.name, loading: "lazy" });
    img.onerror = () => img.replaceWith(el("div", { className: "file", textContent: f.name.split(".").pop().toUpperCase() }));
    return el("figure", {}, el("a", { href: "/scans/" + url, target: "_blank", rel: "noopener" }, img),
      el("figcaption", {}, box, el("span", { textContent: f.name })));
  }));
  updatePdfButton();
}
function updatePdfButton() {
  $("#pdf").disabled = !picked.length;
  $("#pdf").textContent = picked.length ? `Combine ${picked.length} page${picked.length > 1 ? "s" : ""} into PDF` : "Combine selected into PDF";
}

// ---------------------------------------------------------------- actions

const output = () => ({ format: $("#format").value, quality: +$("#quality").value });
const saveOutput = () => {
  store.set("format", $("#format").value);
  store.set("quality", $("#quality").value);
  $("#qval").textContent = $("#quality").value;
  $("#qrow").hidden = !["jpeg", "pdf"].includes($("#format").value);
  api("/api/output", output()).catch(() => {});
};
$("#format").value = store.get("format") || "png";
$("#quality").value = store.get("quality") || 85;
$("#format").onchange = $("#quality").onchange = saveOutput;
$("#quality").oninput = () => $("#qval").textContent = $("#quality").value;
saveOutput();

$("#preview").onclick = () => api("/api/preview", {}).catch(fail);
$("#scan").onclick = () => api("/api/scan", output()).catch(fail);
$("#cancel").onclick = () => api("/api/cancel", {}).catch(fail);
$("#folder").onclick = () => api("/api/open-folder", {}).catch(fail);
$("#adv").onchange = render;
$("#devices").onchange = async () => {
  try { await api("/api/device", { name: $("#devices").value }); await loadOptions(); } catch (e) { fail(e); }
};
$("#pdf").onclick = async () => {
  try {
    const r = await api("/api/pdf", { files: picked, quality: +$("#quality").value });
    toast("Saved " + r.file);
    picked = [];
    loadScans();
  } catch (e) { fail(e); }
};

// ---------------------------------------------------------------- status polling

let connected = null, seenJob = null, seenEvent = null;
async function poll() {
  let s;
  try { s = await api("/api/state"); } catch {
    $("#conn").className = "";
    $("#conn").textContent = "ScanRevive is not running";
    $("#preview").disabled = $("#scan").disabled = true;
    return setTimeout(poll, 2000);
  }
  $("#conn").className = s.connected ? "on" : "";
  $("#conn").textContent = s.connected ? `${s.device.vendor} ${s.device.model}` : (s.error || "Looking for the scanner…");
  $("#outdir").textContent = "Saved in " + s.outdir;
  const devs = $("#devices");
  devs.hidden = s.devices.length < 2;
  if (!devs.hidden && devs.options.length !== s.devices.length)
    devs.replaceChildren(...s.devices.map(d => el("option", { value: d.name, textContent: d.label, selected: s.device && d.name === s.device.name })));
  if (s.connected !== connected) { connected = s.connected; if (connected) loadOptions(); }

  const j = s.job, running = j.state === "running";
  $("#preview").disabled = $("#scan").disabled = running || !s.connected;
  $("#cancel").disabled = !running;
  const p = $("#progress");
  p.hidden = !running;
  if (running && j.progress == null) p.removeAttribute("value"); else p.value = j.progress || 0;
  $("#jobtext").textContent = !running ? "" : j.progress
    ? `${j.kind === "preview" ? "Previewing" : "Scanning"}… ${Math.round(j.progress * 100)}%`
    : "Warming up the lamp and calibrating…";

  if (seenJob === null) seenJob = running ? j.id - 1 : j.id;
  if (!running && j.id > seenJob) {
    seenJob = j.id;
    if (j.state === "done" && j.kind === "preview") { $("#pv").src = "/api/preview.png?" + j.id; $("#hint").hidden = true; }
    if (j.state === "done" && j.kind === "scan") { toast("Saved " + j.file); loadScans(); }
    if (j.state === "error") { toast(j.error, true); loadScans(); }
    if (j.state === "cancelled") toast("Cancelled");
  }
  for (const ev of s.events) {
    if (seenEvent !== null && ev.id > seenEvent) {
      toast(`“${ev.button}” button pressed on the scanner`);
      const row = document.getElementById("hw-" + ev.button);
      if (row) { row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1500); }
    }
  }
  seenEvent = s.events.length ? s.events[s.events.length - 1].id : (seenEvent ?? 0);
  setTimeout(poll, running ? 400 : 1000);
}

poll();
loadScans();
</script>
</body>
</html>
